spring:
  application:
    name: accounts

  datasource:
    url: "jdbc:h2:mem:testdb"
    driver-class-name: org.h2.Driver
    username: sa
    password: '12345'

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: "org.hibernate.dialect.H2Dialect"
    hibernate:
      ddl-auto: update
    show-sql: true

  output:
    ansi:
      enabled: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO

    # Your application
    com.example.accounts: DEBUG

    # Spring MVC
    org.springframework.web: INFO

    # Hibernate SQL
    org.hibernate.SQL: DEBUG

    # SQL Parameters
    org.hibernate.orm.jdbc.bind: TRACE

    # Transactions
    org.springframework.transaction: DEBUG

    # HikariCP
    com.zaxxer.hikari: INFO

  file:
    name: logs/accounts.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
      clean-history-on-start: true

  pattern:
    console: >
      %clr(%d{HH:mm:ss.SSS}){cyan}
      %clr(%-5level){green}
      %clr([%thread]){yellow}
      %clr(%logger{25}){blue}
      - %msg%n

    file: >
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      %-5level
      [%thread]
      %logger{36}
      - %msg%n

server:
  port: 8080